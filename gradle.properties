# One daemon configures both Fabric Loom and NeoForge's ModDevGradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Shared by every project in the repository. The Minecraft and loader versions each build targets live with that
# build: flatgen/versions/<minecraft>-<loader>/gradle.properties.
# Either licence, at the user's option, as an SPDX expression. One string, since fabric.mod.json reads a list of
# licences as all of them applying.
mod_license=Apache-2.0 OR MIT
