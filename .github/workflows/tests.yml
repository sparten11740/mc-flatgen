name: tests

# Every node's unit tests and GameTests, each node in a job of its own, on every push to main, as Blockpilot's game
# tests run; a run by hand tests the nodes named. The GameTests run on a headless GameTest server, so no display is
# needed. Releases don't wait for it: release.yml runs the same tests itself (build.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nodes:
        description: Nodes to test, comma-separated, such as 26.3-fabric; all when empty
        required: false
        default: ''

permissions:
  contents: read

# A newer push tests every commit an older run would have; a run by hand doesn't cancel a push's run.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nodes:
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.list.outputs.nodes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the nodes
        id: list
        env:
          CHOSEN: ${{ inputs.nodes }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          configured = sorted(os.listdir("flatgen/versions"))
          chosen = os.environ.get("CHOSEN", "").replace(",", " ").split() or configured
          unknown = [node for node in chosen if node not in configured]
          if unknown:
              raise SystemExit(f"::error::Unknown nodes {unknown}; these exist: {' '.join(configured)}")
          print("nodes=" + json.dumps(chosen))
          EOF

  test:
    needs: nodes
    name: ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.nodes.outputs.nodes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Point Gradle at each Java
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64" \
            >> ~/.gradle/gradle.properties
      - name: Test ${{ matrix.node }}
        timeout-minutes: 30
        env:
          NODE: ${{ matrix.node }}
        run: ./gradlew ":flatgen:$NODE:build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tests-${{ matrix.node }}
          path: flatgen/versions/${{ matrix.node }}/build/reports/
          if-no-files-found: warn
