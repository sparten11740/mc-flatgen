name: build

# Run by hand only, when the owner asks (Actions minutes cost money; /diff-check and ./gradlew build gate every commit
# locally), and for every release tag through release.yml: the pictures are what tools/sprites.py writes, every node
# builds and passes its unit tests and GameTests, and every jar boots a real dedicated server of its loader, on the
# loader version it is built with and on the oldest it accepts (docs/backlog/20-release-v1.md).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nobody drew a picture by hand, and nobody forgot to rerun the script after changing one.
  pictures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rerun the pictures' script
        run: python3 tools/sprites.py
      - name: Nothing it writes differs from what is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::tools/sprites.py writes something other than what is committed"
            exit 1
          fi

  # Every node built and its tests and GameTests run, the GameTests on a headless GameTest server.
  build:
    runs-on: ubuntu-latest
    outputs:
      boots: ${{ steps.boots.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build every node and run its tests
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars
          path: build/libs/*.jar
          if-no-files-found: error
      - name: List the nodes to boot
        id: boots
        run: echo "matrix=$(node tools/boot.mjs --matrix)" >> "$GITHUB_OUTPUT"

  # Each jar on real dedicated servers of its loader, as players run it; faults of remapping, mixin configs and
  # metadata show only here.
  boot:
    needs: build
    name: boot ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.boots) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars
          path: build/libs
      - name: Boot the jar
        env:
          NODE: ${{ matrix.node }}
        run: node tools/boot.mjs "$NODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: boot-logs-${{ matrix.node }}
          path: build/boot/*/logs/
