name: release

# A tag v<mod_version> releases that build, as Blockpilot releases (docs/release/releasing.md): the tag must match
# mod_version and CHANGELOG.md have a section headed with the version; the tagged commit passes everything the build
# workflow checks (build.yml: the pictures, every node built with its tests and GameTests, every jar booted), and its
# jars are the ones released. Each jar goes to CurseForge, and once every upload has gone through, a GitHub release
# takes them all; an alpha or beta goes out as that release type on both. The notes on both are the changelog's
# section.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything build.yml checks, on the tagged commit; its jars are the ones released.
  checks:
    uses: ./.github/workflows/build.yml

  collect:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-type: ${{ steps.version.outputs.release-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the mod version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(sed -n 's/^mod_version=//p' flatgen/gradle.properties)"
          if [ "$version" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match mod_version $expected in flatgen/gradle.properties"
            exit 1
          fi
          case "$version" in
            *-alpha*) type=alpha ;;
            *-beta*) type=beta ;;
            *) type=release ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release-type=$type" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars
          path: build/libs
      - name: Collect the jars and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          cp build/libs/flatgen-"$VERSION"+*.jar dist/
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > dist/release-notes.md
          expected="$(find flatgen/versions -mindepth 2 -maxdepth 2 -name gradle.properties | wc -l)"
          if [ "$(ls dist/flatgen-"$VERSION"+*.jar | wc -l)" -ne "$expected" ]; then
            echo "::error::Expected $expected jars for $VERSION in build/libs"
            exit 1
          fi
          if ! grep -q '[^[:space:]]' dist/release-notes.md; then
            echo "::error::CHANGELOG.md has no section headed ## $VERSION"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Each jar, named for the Minecraft version it is built against, with the game versions and loaders it runs on where
  # those are more: the 1.20.1 Forge jar runs on NeoForge 47.1 too, the 26.1 Fabric jar on every 26.1 release.
  curseforge:
    needs: collect
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraft: 1.20.1, loader: fabric, loader-name: Fabric, java: 17 }
          - { minecraft: 1.20.1, loader: forge, loader-name: Forge, java: 17, loaders: 'forge, neoforge' }
          - { minecraft: 1.21.1, loader: neoforge, loader-name: NeoForge, java: 21 }
          - { minecraft: 1.21.1, loader: fabric, loader-name: Fabric, java: 21 }
          - { minecraft: 1.21.11, loader: neoforge, loader-name: NeoForge, java: 21 }
          - { minecraft: 1.21.11, loader: fabric, loader-name: Fabric, java: 21 }
          - { minecraft: 26.1.2, loader: neoforge, loader-name: NeoForge, java: 25 }
          - { minecraft: 26.1.2, loader: fabric, loader-name: Fabric, java: 25, game-versions: '26.1, 26.1.1, 26.1.2' }
          - { minecraft: '26.2', loader: neoforge, loader-name: NeoForge, java: 25 }
          - { minecraft: '26.2', loader: fabric, loader-name: Fabric, java: 25 }
          - { minecraft: '26.3', loader: neoforge, loader-name: NeoForge, java: 25 }
          - { minecraft: '26.3', loader: fabric, loader-name: Fabric, java: 25 }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: sparten11740/mod-publish-actions/curseforge/upload@v1
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          file: dist/flatgen-*+${{ matrix.minecraft }}-${{ matrix.loader }}.jar
          display-name: >-
            Flatgen ${{ needs.collect.outputs.version }} for ${{ matrix.loader-name }} ${{ matrix.minecraft }}
          game-versions: ${{ matrix.game-versions || matrix.minecraft }}
          loaders: ${{ matrix.loaders || matrix.loader }}
          java-versions: ${{ matrix.java }}
          environment: client
          release-type: ${{ needs.collect.outputs.release-type }}
          changelog-file: dist/release-notes.md

  # Published last, once every upload has gone through.
  github-release:
    needs: [collect, curseforge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.collect.outputs.version }}
          RELEASE_TYPE: ${{ needs.collect.outputs.release-type }}
        run: |
          prerelease=()
          if [ "$RELEASE_TYPE" != release ]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag "${prerelease[@]}" \
            --title "Flatgen $VERSION" --notes-file dist/release-notes.md dist/*.jar
