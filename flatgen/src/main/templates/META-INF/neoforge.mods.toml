modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# The mod list's picture of Flatgen, drawn by tools/icon.py.
logoFile="assets/${mod_id}/icon.png"
# A client mod: servers neither need it nor check that a client has it.
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

# Flatgen's one mixin both loaders share: Customize opens Flatgen on Superflat and on mods' world types that are
# superflat underneath (docs/backlog/18-other-flat-world-types.md).
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_min_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Blockpilot, which Flatgen gives commands of its own when it is there (docs/backlog/26-blockpilot-commands.md): never
# required, and any release: an older one than the commands are built against is left alone at runtime, as a range
# here would stop the game for a player who has one.
[[dependencies.${mod_id}]]
modId="blockpilot"
type="optional"
versionRange="*"
ordering="NONE"
side="CLIENT"
