modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# A client mod: servers neither need it nor check that a client has it.
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_min_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Blockpilot, which Flatgen gives commands of its own when it is there (docs/backlog/26-blockpilot-commands.md): never
# required, but from the release whose API the commands are built against.
[[dependencies.${mod_id}]]
modId="blockpilot"
type="optional"
versionRange="[${blockpilot_release},)"
ordering="NONE"
side="CLIENT"
