modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# The mod list's picture of Flatgen, drawn by tools/icon.py.
logoFile="assets/${mod_id}/icon.png"
# A client mod: servers neither need it nor check that a client has it.
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

# Forge 1.20.1 finds Flatgen's one mixin in the jar's manifest (build.forge.gradle.kts), not here.

# Forge from 47.1, so NeoForge 47.1, which reports itself as Forge 47.1, loads the jar too.
[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_min_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Blockpilot, which Flatgen gives commands of its own when it is there (docs/backlog/26-blockpilot-commands.md): never
# required, and any release: an older one than the commands are built against is left alone at runtime, as a range
# here would stop the game for a player who has one.
[[dependencies.${mod_id}]]
modId="blockpilot"
mandatory=false
versionRange="[0,)"
ordering="NONE"
side="CLIENT"
