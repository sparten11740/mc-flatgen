mod_id=flatgen
mod_name=Flatgen
mod_version=0.1.0-alpha.4
mod_group_id=dev.flatgen
# Blockpilot's API, which Flatgen's own Blockpilot commands compile against, from the jar attached to the Blockpilot
# release named second (docs/backlog/26-blockpilot-commands.md); the commands need that release or a later one.
blockpilot_api_version=2.2.0
blockpilot_release=1.4.0
# The one-line description both loaders' metadata show in their mod lists.
mod_description=A better superflat screen: edit layers where you see them, pick blocks and biomes from pictures, see what the world will be like before you create it, and keep presets with favourites and a default.
