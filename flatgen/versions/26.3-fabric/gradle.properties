minecraft_version=26.3
minecraft_version_range=26.3
java_version=25
# The tree beside src/main this node builds from: src/<this>.
version_sources=26.1
# Built and run in development with the first; the mod accepts the second and newer, which Fabric API also requires.
fabric_loader_version=0.20.1
fabric_loader_min_version=0.19.3
# Fabric API in the dev client only, for Blockpilot; Flatgen does not need it.
fabric_api_version=0.165.2+26.3
# The GameTests use Fabric API's own GameTest annotation, as from 1.21.5.
fabric_gametest_api=true
# Blockpilot releases a jar for this node, which the client run takes with -Pflatgen.blockpilot=<version>.
blockpilot=true
