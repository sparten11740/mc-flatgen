minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
java_version=17
# The tree beside src/main this node builds from: src/<this>.
version_sources=1.20.1
# Built and run in development with the first; the jar declares the second and newer, so it also loads on NeoForge
# 47.1, which reports itself as Forge 47.1, as Glowline's does.
forge_version=47.4.29
forge_version_range=[47.1,)
loader_version_range=[47,)
# The resource pack format of 1.20.1, for the pack.mcmeta Forge needs to serve the mod's resources.
pack_format=15
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
# The Mixin annotation processor that writes the refmap Forge needs for the shared mixin.
mixin_version=0.8.5
# 1.20.1's data packs keep structures in structures/, which 1.21 renamed structure/.
structure_folder=structures
# 1.20.1 draws TrueType fonts with stb_truetype, which sizes a font by its whole height, where later releases' FreeType
# sizes it by its em; Inter's whole height is this many ems, so its fonts are written larger by it to look the same.
ttf_size_factor=1.2099609375
# How much lower each text style's glyphs must be set, in GUI pixels, to sit where FreeType sets them, as measured
# against 1.21.11's screens.
ttf_shift_down=body:1.5,strong:1.5,title:0
# How many times finer its glyphs are drawn than the window's pixels: stb_truetype leaves a letter between pixels where
# FreeType snaps it to them, and a thin stroke drawn at the window's own pixels can fall between two and fade.
ttf_oversample_factor=2
# Blockpilot releases a jar for this node, which the client run takes with -Pflatgen.blockpilot=<version>.
blockpilot=true
