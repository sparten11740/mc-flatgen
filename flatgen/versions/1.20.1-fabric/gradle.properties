minecraft_version=1.20.1
minecraft_version_range=1.20.1
java_version=17
# The tree beside src/main this node builds from: src/<this>.
version_sources=1.20.1
# Built and run in development with the first; the mod accepts the second and newer, which Fabric API also requires.
fabric_loader_version=0.20.1
fabric_loader_min_version=0.16.10
# Fabric API in the dev client only, for Blockpilot; Flatgen does not need it.
fabric_api_version=0.92.12+1.20.1
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
# 1.20.1's data packs keep structures in structures/, which 1.21 renamed structure/.
structure_folder=structures
# 1.20.1 draws TrueType fonts with stb_truetype rather than FreeType, so the build rewrites Flatgen's fonts for it
# (common.gradle.kts).
stb_truetype=true
# Blockpilot releases a jar for this node, which the client run takes with -Pflatgen.blockpilot=<version>.
blockpilot=true
